name: CI

# Runs on pull requests into main only, not on every push. Keep main green:
# a PR must pass before it can be merged.
on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Pytest (unit + integration, no token)
        # Excludes eval-marked tests: those hit the real IU endpoint and cost
        # shared quota, so they run in the separate eval workflow, never on PRs.
        run: uv run pytest -m "not eval" -q

      # Pipeline smoke test removed: extractors now call the LLM, so a real
      # token is needed. End-to-end graph coverage lives in the pytest suite
      # via the fake_llm fixture (see tests/integration/test_graph_e2e.py).

  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ingest
          POSTGRES_PASSWORD: ingest
          POSTGRES_DB: ingest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ingest -d ingest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Pytest (db tests)
        env:
          DATABASE_URL: postgresql://ingest:ingest@localhost:5432/ingest
        run: uv run pytest -m db -q
