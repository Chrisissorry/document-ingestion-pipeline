name: CI

# Runs on pull requests into main only, not on every push. Keep main green:
# a PR must pass before it can be merged.
on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Pipeline smoke test
        # No API token needed: the stub extractors do not call the model.
        run: uv run python -m ingest samples/sample_invoice.pdf
