[project]
name = "document-ingestion-pipeline"
version = "0.1.0"
description = "Agentic document ingestion pipeline (IU seminar SS2026)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "anthropic>=0.40",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
