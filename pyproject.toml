[project]
name = "document-ingestion-pipeline"
version = "0.1.0"
description = "Agentic document ingestion pipeline (IU seminar SS2026)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "anthropic>=0.40",
    "fpdf2>=2.7",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[dependency-groups]
dev = ["ruff>=0.4", "mypy>=1.10", "pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-m 'not eval'"
markers = ["eval: real-model eval tests, requires ANTHROPIC_AUTH_TOKEN"]
dev = ["ruff>=0.4", "mypy>=1.10", "pre-commit>=3.7", "pytest>=8"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
